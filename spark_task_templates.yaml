# spark_task_templates.yaml
# 定义"功能类别"的算法选项 + 参数 schema
# 与 spark_tasks.yaml 互补：
#   - spark_tasks.yaml: 哪些 launch 可用（自动发现 + 精编）
#   - spark_task_templates.yaml: 哪些 launch 需要算法选择 + 参数配置

task_templates:
  # ========== 2D 激光建图 ==========
  slam_2d:
    label: 2D 激光建图
    description: 用 2D 激光雷达（LaserScan）建 2D 占用栅格地图，用于后续导航
    required_topic: sensor_msgs/LaserScan
    algorithms:
      - id: gmapping
        name: GMapping
        description: 经典 2D 栅格建图算法，资源占用低，适合小环境（< 5000 m²）
        launch: slam_gmapping.launch.py
        package: slam_gmapping
        params_schema:
          - key: map_name
            label: 地图名（保存目录）
            type: string
            default: my_map
          - key: resolution
            label: 分辨率 (m/cell)
            type: number
            default: 0.05
            min: 0.01
            max: 0.2
            step: 0.01
          - key: max_range
            label: 最大激光距离 (m)
            type: number
            default: 30.0
            min: 1.0
            max: 100.0
            step: 1.0
      - id: cartographer
        name: Cartographer
        description: Google 开源 SLAM，特征丰富，支持 2D 和 3D 地图
        launch: cartographer.launch.py
        package: cartographer_ros
        params_schema:
          - key: config_basename
            label: 配置文件名（不含.lua 后缀）
            type: select
            options: [cartographer, cartographer_2d, pure_localization]
            default: cartographer
          - key: resolution
            label: 分辨率 (m/cell)
            type: number
            default: 0.05
            min: 0.01
            max: 0.2
            step: 0.01

  # ========== 2D 激光导航 ==========
  navigation_2d:
    label: 2D 激光导航
    description: 在 RViz 中 2D Pose Estimate 定位 → 2D Nav Goal 导航；可选 Nav2 实时建图或 RTAB-Map 3D 定位
    required_topic: sensor_msgs/LaserScan
    algorithms:
      - id: nav2_slam
        name: Nav2 实时建图导航
        description: slam_toolbox 实时建图 + Nav2 一体（start_spark_navigation2），无需预先建图，适合首次探索
        launch: start_spark_navigation2.launch.py
        package: spark_navigation2
        params_schema:
          - key: camera_type_tel
            label: 相机类型
            type: select
            options: [d435, astra_pro]
            default: d435
          - key: lidar_type_tel
            label: 雷达类型
            type: select
            options: [ydlidar_g2, ydlidar_g6]
            default: ydlidar_g6
          - key: namespace
            label: 命名空间（多机器人，留空单机）
            type: string
            default: ""
          - key: start_bringup_rviz
            label: 启动 RViz 可视化
            type: select
            options: ['true', 'false']
            default: 'false'
      - id: rtabmap_3d
        name: RTAB-Map 3D 深度导航
        description: 深度相机 RTAB-Map 定位导航（start_rtabmap_rgbd_sync）；已建图后请选「定位模式=true」回到地图
        launch: start_rtabmap_rgbd_sync.launch.py
        package: spark_rtab_map
        params_schema:
          - key: camera_type_tel
            label: 相机类型
            type: select
            options: [d435, astra_pro]
            default: d435
          - key: lidar_type_tel
            label: 雷达类型
            type: select
            options: [ydlidar_g2, ydlidar_g6]
            default: ydlidar_g6
          - key: localization
            label: 定位模式（true=用已存地图定位）
            type: select
            options: ['false', 'true']
            default: 'false'
          - key: namespace
            label: 命名空间（多机器人，留空单机）
            type: string
            default: ""

  # ========== 深度学习检测 ==========
  detection:
    label: 深度学习检测
    description: 相机画面实时目标检测 / 人体姿态识别（YOLOv8）
    algorithms:
      - id: yolov8_obj
        name: YOLOv8 物品识别
        description: 对相机画面做目标检测，标注物品类别与置信度
        launch: spark_yolo_object.launch.py
        package: spark_yolov8
        params_schema:
          - key: camera_type_tel
            label: 相机类型
            type: select
            options: [d435, astra_pro]
            default: d435
          - key: lidar_type_tel
            label: 雷达类型
            type: select
            options: [ydlidar_g2, ydlidar_g6]
            default: ydlidar_g6
          - key: namespace
            label: 命名空间（多机器人，留空单机）
            type: string
            default: ""
      - id: yolov8_pose
        name: YOLOv8 肢体识别
        description: 对相机画面做人体姿态关键点识别
        launch: spark_yolo_pose.launch.py
        package: spark_yolov8
        params_schema:
          - key: camera_type_tel
            label: 相机类型
            type: select
            options: [d435, astra_pro]
            default: d435
          - key: lidar_type_tel
            label: 雷达类型
            type: select
            options: [ydlidar_g2, ydlidar_g6]
            default: ydlidar_g6
          - key: namespace
            label: 命名空间（多机器人，留空单机）
            type: string
            default: ""

  # ========== 激光跟随 ==========
  following:
    label: 激光跟随
    description: 用激光雷达锁定前方目标并跟随移动
    required_topic: sensor_msgs/LaserScan
    algorithms:
      - id: laser_follower
        name: 激光跟随
        description: 根据激光点云识别前方最近目标，保持距离跟随（spark_follower）
        launch: spark_follower.launch.py
        package: spark_follower
        params_schema:
          - key: camera_type_tel
            label: 相机类型
            type: select
            options: [d435, astra_pro]
            default: d435
          - key: lidar_type_tel
            label: 雷达类型
            type: select
            options: [ydlidar_g2, ydlidar_g6]
            default: ydlidar_g6
          - key: namespace
            label: 命名空间（多机器人，留空单机）
            type: string
            default: ""
          - key: start_bringup_rviz
            label: 启动 RViz 可视化
            type: select
            options: ['true', 'false']
            default: 'false'
